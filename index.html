<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glitch Visualizer v4.4 - High Quality Export</title><script src="https://cdn.tailwindcss.com"></script><style>html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    /* Updated Canvas Layout for Spotify Mode */
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #111;
      background-image: radial-gradient(#222 1px, transparent 1px);
      background-size: 20px 20px;
      /* CSS Background properties for the user uploaded image */
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      position: relative;
    }

    canvas {
      display: block;
      /* Important: Canvas must be transparent for CSS BG to show through */
      background: transparent;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* When 9:16 mode is active */
    canvas.portrait-mode {
      width: auto !important;
      height: 95% !important;
      aspect-ratio: 9 / 16;
      border: 2px solid #333;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-radius: 8px;
    }

    #controls {
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 0.5rem;
      border-radius: 0 0 8px 0;
      z-index: 10;
      width: 300px;
      backdrop-filter: blur(5px);
      max-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #controls label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
    #controls input[type="range"] {
      width: 100%;
      margin-bottom: 0.75rem;
    }
    #controls input[type="number"] {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      width: 60px;
    }
    #controls select {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      width: 100%;
      margin-bottom: 0.75rem;
    }
    #start-recording-button:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }</style><script defer="defer" src="./js/app.js"></script></head><body><div id="canvas-container"><canvas id="visualizer-canvas"></canvas></div><div id="controls" class="text-white max-h-screen flex flex-col"><button id="toggle-controls" class="flex items-center text-left flex-shrink-0"><svg id="arrow-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform duration-300 transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></button><div id="controls-content" class="transition-all duration-300 ease-in-out max-h-0 opacity-0 overflow-y-auto"><h2 class="text-lg font-semibold pt-2">Controls</h2><div class="mt-4 space-y-4"><label for="auto-rotate-toggle" class="flex items-center justify-between cursor-pointer"><span class="mr-3 text-sm">Auto-Rotate</span><div class="relative"><input type="checkbox" id="auto-rotate-toggle" class="sr-only peer" checked="checked"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-purple-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div id="rotation-slider-container"><label for="rotation-slider">Rotation Speed</label> <input type="range" id="rotation-slider" min="0" max="0.05" step="0.001" value="0.005" class="w-full mb-2 cursor-pointer"></div><label for="auto-camera-toggle" class="flex items-center justify-between cursor-pointer"><span class="mr-3 text-sm">Auto-Camera</span><div class="relative"><input type="checkbox" id="auto-camera-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-purple-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div class="pt-4 border-t border-gray-600"><h3 class="text-md font-semibold mb-2">Shapes</h3><div><label for="shape-select">Shape</label> <select id="shape-select"><option value="Sphere">Sphere</option><option value="Box">Box</option><option value="Torus">Torus</option><option value="Cone">Cone</option></select></div><div><label for="material-select">Material</label> <select id="material-select"><option value="Hue">Hue (Normal)</option><option value="Monochrome">Monochrome</option><option value="Lit">Lit (White)</option></select></div><label for="smooth-surface-toggle" class="flex items-center cursor-pointer"><span class="mr-3 text-sm">Smooth Surface</span><div class="relative"><input type="checkbox" id="smooth-surface-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-purple-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div class="mt-2"><label for="shape-count-slider">Shape Count</label><div class="flex justify-between items-center mb-2"><input type="range" id="shape-count-slider" min="1" max="50" step="1" value="1" class="w-full cursor-pointer mr-3"> <span id="shape-count-value" class="text-sm text-gray-300 w-6 text-right">1</span></div></div><div id="shape-controls-container"><div id="sphere-controls"><label for="detail-slider">Sphere Detail</label><div class="flex justify-between items-center mb-2"><input type="range" id="detail-slider" min="0" max="50" step="1" value="3" class="w-full cursor-pointer mr-3"> <span id="detail-value" class="text-sm text-gray-300 w-6 text-right">3</span></div></div><div id="box-controls" class="hidden"><label for="box-segments-slider">Box Segments</label><div class="flex justify-between items-center mb-2"><input type="range" id="box-segments-slider" min="1" max="50" step="1" value="1" class="w-full cursor-pointer mr-3"> <span id="box-segments-value" class="text-sm text-gray-300 w-6 text-right">1</span></div></div><div id="torus-controls" class="hidden"><label for="torus-radial-slider">Torus Radial Segments</label><div class="flex justify-between items-center mb-2"><input type="range" id="torus-radial-slider" min="3" max="100" step="1" value="16" class="w-full cursor-pointer mr-3"> <span id="torus-radial-value" class="text-sm text-gray-300 w-6 text-right">16</span></div><label for="torus-tubular-slider">Torus Tubular Segments</label><div class="flex justify-between items-center mb-2"><input type="range" id="torus-tubular-slider" min="3" max="100" step="1" value="100" class="w-full cursor-pointer mr-3"> <span id="torus-tubular-value" class="text-sm text-gray-300 w-6 text-right">100</span></div></div><div id="cone-controls" class="hidden"><label for="cone-segments-slider">Cone Radial Segments</label><div class="flex justify-between items-center mb-2"><input type="range" id="cone-segments-slider" min="3" max="100" step="1" value="32" class="w-full cursor-pointer mr-3"> <span id="cone-segments-value" class="text-sm text-gray-300 w-6 text-right">32</span></div></div></div></div><div class="pt-4 border-t border-gray-600"><h3 class="text-md font-semibold mb-2">Transform (No Distortion)</h3><div><label for="pos-x-slider" class="flex justify-between"><span>Position X (Left/Right)</span> <span id="pos-x-val" class="text-xs text-gray-400">0</span></label> <input type="range" id="pos-x-slider" min="-5" max="5" step="0.1" value="0" class="w-full cursor-pointer"></div><div><label for="pos-y-slider" class="flex justify-between"><span>Position Y (Up/Down)</span> <span id="pos-y-val" class="text-xs text-gray-400">0</span></label> <input type="range" id="pos-y-slider" min="-5" max="5" step="0.1" value="0" class="w-full cursor-pointer"></div><div><label for="scale-slider" class="flex justify-between"><span>Scale (Size)</span> <span id="scale-val" class="text-xs text-gray-400">1</span></label> <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1" class="w-full cursor-pointer"></div><button id="reset-transform-btn" class="text-xs text-purple-300 underline mt-1">Reset Transform</button></div><div class="pt-4 border-t border-gray-600"><h3 class="text-md font-semibold mb-2">Effects</h3><div><label for="bpm-slider">BPM</label><div class="flex justify-between items-center mb-2"><input type="range" id="bpm-slider" min="60" max="180" step="1" value="120" class="w-full cursor-pointer mr-3"> <span id="bpm-value" class="text-sm text-gray-300 w-6 text-right">120</span></div></div><label for="pulse-effects-toggle" class="flex items-center justify-between cursor-pointer"><span class="mr-3 text-sm">BPM Pulse Effects</span><div class="relative"><input type="checkbox" id="pulse-effects-toggle" class="sr-only peer" checked="checked"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-purple-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label> <label for="random-glitch-toggle" class="flex items-center justify-between cursor-pointer mt-2"><span class="mr-3 text-sm">Random Glitch</span><div class="relative"><input type="checkbox" id="random-glitch-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-red-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div class="mt-4"><label for="film-noise-slider">Film Noise</label> <input type="range" id="film-noise-slider" min="0" max="2" step="0.05" value="0.2" class="w-full mb-2 cursor-pointer"></div><div><label for="film-scanline-slider">Film Scanlines</label> <input type="range" id="film-scanline-slider" min="0" max="1" step="0.01" value="0.1" class="w-full mb-2 cursor-pointer"></div><label for="afterimage-toggle" class="flex items-center justify-between cursor-pointer mt-4"><span class="mr-3 text-sm">Afterimage (Trails)</span><div class="relative"><input type="checkbox" id="afterimage-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-blue-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div class="mt-2"><label for="afterimage-damp-slider">Afterimage Damp (Fade)</label> <input type="range" id="afterimage-damp-slider" min="0.5" max="0.99" step="0.01" value="0.9" class="w-full mb-2 cursor-pointer"></div><label for="dot-screen-toggle" class="flex items-center justify-between cursor-pointer mt-2"><span class="mr-3 text-sm">Dot Screen</span><div class="relative"><input type="checkbox" id="dot-screen-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-blue-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div class="mt-2"><label for="dot-screen-scale-slider">Dot Screen Scale</label> <input type="range" id="dot-screen-scale-slider" min="0.1" max="5" step="0.1" value="1" class="w-full mb-2 cursor-pointer"></div></div><div class="pt-4 border-t border-gray-600"><h3 class="text-md font-semibold mb-2">Spotify Canvas Tools</h3><label for="force-portrait-toggle" class="flex items-center justify-between cursor-pointer"><span class="mr-3 text-sm">Force 9:16 Mode</span><div class="relative"><input type="checkbox" id="force-portrait-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-green-500 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label><div class="mt-4"><label class="block text-sm mb-2">Background Image</label> <input type="file" id="bg-image-upload" accept="image/*" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700"/> <button id="clear-bg-button" class="mt-2 text-xs text-red-400 underline hidden">Remove Background</button></div></div><div class="pt-4 border-t border-gray-600"><h3 class="text-md font-semibold mb-2">Recording & Saving</h3><div class="flex items-center justify-between mb-2"><label for="recording-duration" class="text-sm">Duration (sec):</label> <input type="number" id="recording-duration" min="1" max="60" value="10" class="text-white text-sm"></div><button id="start-recording-button" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition-colors">Start Recording</button> <label for="image-orientation-toggle" class="flex items-center justify-between cursor-pointer mt-4"><span class="mr-3 text-sm">Portrait Snapshot (9:16)</span><div class="relative"><input type="checkbox" id="image-orientation-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-blue-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label> <label for="transparent-bg-toggle" class="flex items-center justify-between cursor-pointer mt-2"><span class="mr-3 text-sm">Transparent Background</span><div class="relative"><input type="checkbox" id="transparent-bg-toggle" class="sr-only peer"><div class="w-14 h-8 bg-gray-600 rounded-full peer-checked:bg-blue-600 transition-colors"></div><div class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full transition-transform peer-checked:translate-x-full"></div></div></label> <button id="save-image-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors mt-2">Save Snapshot</button> <span id="recording-status" class="text-sm text-yellow-300 mt-2 hidden">Recording...</span><p class="text-xs text-gray-400 mt-2">Saves a video file (MP4 if supported, else WebM). The clean background will be composited into the video automatically.</p></div></div></div></div></body></html>
