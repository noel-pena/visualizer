<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio-Reactive Visualizer</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    html, body {

      background: rgba(255, 255, 255, 0.3);

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
